{% extends "posts/base.html" %}

{% block title %}Contraseña cambiada | Mi Blog{% endblock %}

{% block content %}
<div class="form-blog-container">
    <div class="form-blog-card text-center">
        <div class="mb-4 text-success" style="font-size: 4rem;">
            <i class="bi bi-check-circle-fill"></i>
        </div>
        <h1 class="text-success">¡Contraseña actualizada!</h1>
        <p class="text-muted mt-2">Tu contraseña fue cambiada correctamente.</p>
        <div class="mt-4">
            <a href="{% url 'perfil' %}" class="btn btn-blog-primary">
                <i class="bi bi-person me-2"></i>Volver al perfil
            </a>
        </div>
    </div>
</div>
{% endblock %}
