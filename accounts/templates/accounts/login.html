{% extends "posts/base.html" %}

{% block content %}
<h1>Iniciar sesión</h1>

{% if form.errors %}
<p>El usuario o la contraseña no son correctos.</p>
{% endif %}

<form method="post">
    {% csrf_token %}

    {{ form.as_p }}

    <input type="hidden" name="next" value="{{ next }}" />

    <button type="submit">Entrar</button>
</form>

<p>
    ¿No tenés cuenta?
    <a href="{% url 'registro' %}">Crear cuenta</a>
</p>
{% endblock %}
