{% extends 'posts/base.html' %}

{% block content %}

<h1>{{ post.titulo }}</h1>

<p>Autor: {{ post.autor }}</p>
<p>Estado: {{ post.estado }}</p>
<p>Fecha: {{ post.fecha_creacion }}</p>

{% if post.imagen %}
<img src="{{ post.imagen.url }}" alt="{{ post.titulo }}" width="600">
{% endif %}

<hr>

<p>{{ post.contenido }}</p>

<a href="{% url 'posts:editar_post' post.slug %}">Editar post</a>

<a href="{% url 'posts:post_confirm_delete' post.slug %}">Eliminar post</a>

<a href="{% url 'posts:lista_posts' %}">Volver al listado</a>

{% endblock %}
