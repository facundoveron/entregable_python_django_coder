{/* posts/templates/posts/post_confirm_delete.html */}

<h1>Eliminar post</h1>

<p>¿Estás seguro de que quieres eliminar el siguiente post?</p>

<h2>{{ post.titulo }}</h2>

<p>{{ post.contenido|truncatewords:30 }}</p>

<form method="post">
    {% csrf_token %}

    <button type="submit">Sí, eliminar</button>
</form>

<a href="{% url 'posts:detalle_post' post.slug %}">Cancelar</a>
