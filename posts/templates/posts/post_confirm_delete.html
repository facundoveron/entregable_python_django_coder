{% extends "posts/base.html" %}

{% block title %}Eliminar post | Mi Blog{% endblock %}

{% block content %}
<div class="form-blog-container">
    <div class="form-blog-card border-danger">
        <div class="form-blog-header">
            <div class="text-danger mb-3" style="font-size: 3rem;">
                <i class="bi bi-exclamation-triangle-fill"></i>
            </div>
            <h1 class="text-danger">Eliminar post</h1>
            <p class="text-muted">Esta acción no se puede deshacer.</p>
        </div>

        <div class="alert alert-danger">
            <strong>¿Estás seguro de que querés eliminar este post?</strong>
            <p class="mb-0 mt-2">
                <i class="bi bi-journal-text me-2"></i>{{ post.titulo }}
            </p>
        </div>

        <p class="text-muted">{{ post.get_resumen }}</p>

        <div class="d-flex gap-3 mt-4">
            <form method="post">
                {% csrf_token %}
                <button type="submit" class="btn btn-blog-danger btn-lg">
                    <i class="bi bi-trash me-2"></i>Sí, eliminar definitivamente
                </button>
            </form>
            <a href="{% url 'posts:detalle_post' post.slug %}" class="btn btn-outline-secondary btn-lg">
                <i class="bi bi-arrow-left me-2"></i>Cancelar
            </a>
        </div>
    </div>
</div>
{% endblock %}
